name: Validate DRAFT-ASUB-023

on:
  push:
    branches: [main]
    paths:
      - 'submissions/DRAFT-ASUB-023-public-frontier-v12-gated-autotuner/attack.py'
      - 'tests/test_draft_public_frontier_v12_gated_autotuner.py'
      - '.github/workflows/validate-draft023.yml'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  validate-draft023:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install SDK and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile
        run: python -m py_compile submissions/DRAFT-ASUB-023-public-frontier-v12-gated-autotuner/attack.py

      - name: Structural tests
        run: python -m pytest -q tests/test_draft_public_frontier_v12_gated_autotuner.py

      - name: Official SDK validation
        run: aicomp validate redteam submissions/DRAFT-ASUB-023-public-frontier-v12-gated-autotuner/attack.py

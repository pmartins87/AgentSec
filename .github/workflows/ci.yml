name: AgentSec CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned SDK and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile attack and planning sources
        run: |
          python -m py_compile attack.py
          python -m py_compile ci/gym_smoke_attack.py
          python -m py_compile submissions/ASUB-20260825-001-frontier-canary/attack.py
          python -m py_compile submissions/ASUB-20260825-002-confused-deputy-canary/attack.py
          python -m py_compile submissions/ASUB-20260825-003-semantic-intent-transfer/attack.py
          python -m py_compile submissions/ASUB-20260826-004-public-frontier-v2/attack.py
          python -m py_compile submissions/ASUB-20260826-005-public-frontier-v4-paired-hops/attack.py
          python -m py_compile submissions/ASUB-20260826-006-private-hedge-v2/attack.py
          python -m py_compile submissions/ASUB-20260826-007-public-frontier-v6-timeout-prefix/attack.py
          python -m py_compile submissions/ASUB-20260826-008-private-hedge-v3-timeout-prefix/attack.py
          python -m py_compile submissions/ASUB-20260826-009-private-hedge-v4-coverage-prefix/attack.py
          python -m py_compile submissions/ASUB-20260826-010-public-frontier-v7-format-diverse/attack.py
          python -m py_compile submissions/DRAFT-ASUB-004-robust-mix/attack.py
          python -m py_compile submissions/DRAFT-ASUB-005-public-multipost/attack.py
          python -m py_compile submissions/DRAFT-ASUB-006-public-frontier-v2/attack.py
          python -m py_compile submissions/DRAFT-ASUB-007-forged-multipost-live/attack.py
          python -m py_compile submissions/DRAFT-ASUB-008-intent-launder-portfolio/attack.py
          python -m py_compile submissions/DRAFT-ASUB-009-private-hedge-v2/attack.py
          python -m py_compile submissions/DRAFT-ASUB-010-public-frontier-v3-backfill/attack.py
          python -m py_compile submissions/DRAFT-ASUB-011-public-frontier-v4-paired-hops/attack.py
          python -m py_compile submissions/DRAFT-ASUB-012-public-frontier-v5-multipost-independent/attack.py
          python -m py_compile submissions/DRAFT-ASUB-013-public-frontier-v6-timeout-prefix/attack.py
          python -m py_compile submissions/DRAFT-ASUB-014-private-hedge-v3-timeout-prefix/attack.py
          python -m py_compile submissions/DRAFT-ASUB-015-private-hedge-v4-coverage-prefix/attack.py
          python -m py_compile submissions/DRAFT-ASUB-016-public-frontier-v7-format-diverse/attack.py
          python -m py_compile src/private_guardrail_proxy.py
          python -m py_compile src/semantic_authorization_proxy.py
          python -m py_compile src/portfolio_optimizer.py
          python -m py_compile src/private_scenario_overlay.py
          python -m py_compile src/direct_cd_split.py
          python -m py_compile src/hosted_evidence.py
          python -m py_compile src/final_pair_selector.py
          python -m py_compile scripts/plan_portfolio.py
          python -m py_compile scripts/plan_private_robust_portfolio.py
          python -m py_compile scripts/plan_direct_cd_split.py
          python -m py_compile scripts/interpret_hosted_score.py
          python -m py_compile scripts/plan_final_pair.py

      - name: Run structural regressions
        run: python -m pytest -q tests

      - name: Portfolio planner smoke
        run: |
          python scripts/plan_portfolio.py
          python scripts/plan_private_robust_portfolio.py
          python scripts/plan_direct_cd_split.py

      - name: Hosted-score interpreter smoke
        run: |
          python scripts/interpret_hosted_score.py asub001 56.60
          python scripts/interpret_hosted_score.py duplicate 49.77 56.60
          python scripts/interpret_hosted_score.py asub001-row 12.33 --candidates 180

      - name: Validate R1 attack contract
        run: aicomp validate redteam attack.py

      - name: Validate frozen and draft submission contracts
        run: |
          aicomp validate redteam submissions/ASUB-20260825-001-frontier-canary/attack.py
          aicomp validate redteam submissions/ASUB-20260825-002-confused-deputy-canary/attack.py
          aicomp validate redteam submissions/ASUB-20260825-003-semantic-intent-transfer/attack.py
          aicomp validate redteam submissions/ASUB-20260826-004-public-frontier-v2/attack.py
          aicomp validate redteam submissions/ASUB-20260826-005-public-frontier-v4-paired-hops/attack.py
          aicomp validate redteam submissions/ASUB-20260826-006-private-hedge-v2/attack.py
          aicomp validate redteam submissions/ASUB-20260826-007-public-frontier-v6-timeout-prefix/attack.py
          aicomp validate redteam submissions/ASUB-20260826-008-private-hedge-v3-timeout-prefix/attack.py
          aicomp validate redteam submissions/ASUB-20260826-009-private-hedge-v4-coverage-prefix/attack.py
          aicomp validate redteam submissions/ASUB-20260826-010-public-frontier-v7-format-diverse/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-004-robust-mix/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-005-public-multipost/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-006-public-frontier-v2/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-007-forged-multipost-live/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-008-intent-launder-portfolio/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-009-private-hedge-v2/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-010-public-frontier-v3-backfill/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-011-public-frontier-v4-paired-hops/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-012-public-frontier-v5-multipost-independent/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-013-public-frontier-v6-timeout-prefix/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-014-private-hedge-v3-timeout-prefix/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-015-private-hedge-v4-coverage-prefix/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-016-public-frontier-v7-format-diverse/attack.py

      - name: Deterministic R1 smoke
        run: aicomp test redteam attack.py --budget-s 10 --agent deterministic

      - name: Validate bounded gym smoke contract
        run: aicomp validate redteam ci/gym_smoke_attack.py

      - name: Gym SDK plumbing smoke
        run: |
          aicomp evaluate redteam ci/gym_smoke_attack.py \
            --budget-s 10 \
            --agent deterministic \
            --env gym \
            --artifacts-dir ci_artifacts/r1_gym
          echo '--- score.txt ---'
          cat ci_artifacts/r1_gym/score.txt
          echo '--- report.json ---'
          cat ci_artifacts/r1_gym/report.json

name: AgentSec CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned SDK and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile attack and planning sources
        run: |
          python -m py_compile attack.py
          python -m py_compile submissions/ASUB-20260825-001-frontier-canary/attack.py
          python -m py_compile submissions/ASUB-20260825-002-confused-deputy-canary/attack.py
          python -m py_compile submissions/ASUB-20260825-003-semantic-intent-transfer/attack.py
          python -m py_compile submissions/DRAFT-ASUB-004-robust-mix/attack.py
          python -m py_compile src/private_guardrail_proxy.py
          python -m py_compile src/semantic_authorization_proxy.py
          python -m py_compile src/portfolio_optimizer.py
          python -m py_compile src/hosted_evidence.py
          python -m py_compile scripts/plan_portfolio.py
          python -m py_compile scripts/interpret_hosted_score.py

      - name: Run structural regressions
        run: python -m pytest -q tests

      - name: Portfolio planner smoke
        run: python scripts/plan_portfolio.py

      - name: Hosted-score interpreter smoke
        run: |
          python scripts/interpret_hosted_score.py asub001 56.60
          python scripts/interpret_hosted_score.py duplicate 49.77 56.60
          python scripts/interpret_hosted_score.py asub001-row 12.33 --candidates 180

      - name: Validate R1 attack contract
        run: aicomp validate redteam attack.py

      - name: Validate frozen and draft submission contracts
        run: |
          aicomp validate redteam submissions/ASUB-20260825-001-frontier-canary/attack.py
          aicomp validate redteam submissions/ASUB-20260825-002-confused-deputy-canary/attack.py
          aicomp validate redteam submissions/ASUB-20260825-003-semantic-intent-transfer/attack.py
          aicomp validate redteam submissions/DRAFT-ASUB-004-robust-mix/attack.py

      - name: Deterministic R1 smoke
        run: aicomp test redteam attack.py --budget-s 10 --agent deterministic

      - name: Gym-style R1 evaluation
        run: |
          aicomp evaluate redteam attack.py \
            --budget-s 10 \
            --agent deterministic \
            --env gym \
            --artifacts-dir ci_artifacts/r1_gym
          echo '--- score.txt ---'
          cat ci_artifacts/r1_gym/score.txt
          echo '--- report.json ---'
          cat ci_artifacts/r1_gym/report.json

name: Validate hosted wave decision

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-hosted-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: |
          python -m py_compile src/hosted_wave.py
          python -m py_compile scripts/decide_hosted_wave.py
      - name: Structural tests
        run: python -m pytest -q tests/test_hosted_wave.py
      - name: CLI smoke - clear public improvement
        run: python scripts/decide_hosted_wave.py --asub007 95.0
      - name: CLI smoke - interface control
        run: python scripts/decide_hosted_wave.py --asub007 84.0 --asub010-a 89.0 --asub010-b 87.0

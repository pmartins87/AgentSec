name: Validate DRAFT-ASUB-019

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-draft019:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install SDK and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile submissions/DRAFT-ASUB-019-private-hedge-v6-hierarchical-calibration/attack.py
      - name: Structural tests
        run: python -m pytest -q tests/test_draft_private_hedge_v6_hierarchical_calibration.py
      - name: Official SDK validation
        run: aicomp validate redteam submissions/DRAFT-ASUB-019-private-hedge-v6-hierarchical-calibration/attack.py
